# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml


 
trigger: none

pool:
  name: 'Uipath_Demo'
  demands:
  - agent.name -equals AgentDemo1

steps:
- task: UiPathTest@6
  displayName: 'Run Test Manager Test Set - UID:230'
  timeoutInMinutes: 60
  inputs:
    testTarget: 'TestSet'
    orchestratorConnection: 'Uipath_Cloud_Connection_Demo'
    projectKey: 'UID'
    testSet: 'UID:230'
    folderName: 'Uipath_Testing_Demo'
    traceLevel: 'Verbose'

